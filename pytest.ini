[pytest]
testpaths = tests
# Globally installed plugins (deepeval, opik, langsmith) add ~30s of teardown
# and side effects; this suite calls metrics directly and needs none of them.
addopts = -p no:deepeval -p no:opik -p no:langsmith_plugin
markers =
    smoke: fast wiring checks that cost no judge tokens
    live: calls the real judge model (opt-in via RUN_LIVE_JUDGE=1)
