<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-container {
      height: 400px;
      overflow-y: auto;
      padding: 16px;
      background: white;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.bot {
      align-items: flex-start;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user .message-bubble {
      background: #667eea;
      color: white;
    }

    .message.bot .message-bubble {
      background: #f0f0f0;
      color: #333;
    }

    .message-time {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
    }

    .input-container {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }

    #userInput {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    #userInput:focus {
      border-color: #667eea;
    }

    #sendBtn {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #sendBtn:hover {
      background: #5568d3;
    }

    #sendBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: #f0f0f0;
      border-radius: 12px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      text-align: center;
      padding: 20px;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #666;
    }

    .empty-state p {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI Assistant</h1>
    <p>Ask me anything!</p>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty-state">
      <div class="empty-state-icon">💬</div>
      <h3>Start a conversation</h3>
      <p>Type a message below to begin</p>
    </div>
  </div>

  <div class="input-container">
    <input
      type="text"
      id="userInput"
      placeholder="Type your message..."
      autocomplete="off"
    />
    <button id="sendBtn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
